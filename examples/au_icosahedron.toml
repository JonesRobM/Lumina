# Lumina example: atomistic gold cluster
#
# Au923 Mackay icosahedron (~3.1 nm), one dipole per atom. Run from the
# repository root so the relative .xyz path resolves:
#   cargo run --release -p lumina-cli -- run examples/au_icosahedron.toml
#
# dipole_spacing is (bulk volume per Au atom)^(1/3) = a / 4^(1/3), a = 4.078 Å.
# The CLI illuminates along +z with x polarisation; see README.md
# ("Orientation averaging") for averaging over particle orientations.

[simulation]
wavelengths = { range = [300.0, 850.0], points = 111 }
environment_n = 1.0

[[geometry.object]]
name = "Au923"
material = "Au_JC"
dipole_spacing = 0.2569

[geometry.object.shape]
type = "file"
path = "examples/au_icosahedron_k6.xyz"

[geometry.object.species_map]
Au = "Au_JC"

[output]
directory = "./output/au_icosahedron"
