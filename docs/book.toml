[book]
title = "Lumina Documentation"
authors = ["Lumina Contributors"]
description = "Comprehensive documentation for the Lumina coupled dipole approximation framework."
language = "en"
src = "src"

[build]
build-dir = "../target/book"

[output.html]
# The theory chapters use \( ... \) and \[ ... \]; without this the equations
# render as literal source text.
mathjax-support = true
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/jonesrobm/lumina"
